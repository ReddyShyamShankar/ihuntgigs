# Where Hunt looks for leads. Edit freely (phone-friendly): add/remove lines, push, done.
# kind: funding = company just raised money / launched;  job = hiring a role you can do on contract;
#       ask = someone publicly asking for a freelancer.

# Google News searches. "when:3d" = last 3 days. region: US or IN (India).
news:
  # --- Crypto / Web3 ---
  - {q: 'crypto startup raises seed OR "series A" when:3d', region: US}
  - {q: 'web3 OR blockchain project raises funding when:3d', region: US}
  - {q: 'crypto exchange launches OR "token launch" OR presale when:3d', region: US}
  # --- Forex / prop firms / brokers ---
  - {q: '"forex broker" launches OR licensed OR acquires when:7d', region: US}
  - {q: '"prop firm" OR "proprietary trading firm" launches OR raises when:7d', region: US}
  # --- US stocks / options / fintech ---
  - {q: 'fintech raises seed OR "series A" trading OR investing when:3d', region: US}
  - {q: '"options trading" platform OR app launches OR raises when:7d', region: US}
  - {q: 'brokerage OR "investing app" OR wealthtech raises when:3d', region: US}
  # --- India: stocks / options / fintech ---
  - {q: 'fintech startup raises funding when:3d', region: IN}
  - {q: 'stockbroking OR wealthtech OR "trading app" startup raises when:7d', region: IN}
  - {q: 'SEBI approval broker OR "research analyst" OR "mutual fund" launch when:7d', region: IN}

