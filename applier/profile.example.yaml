# Copy to applier/profile.yaml (git-ignored) and fill in. Empty values are skipped.
first_name: Alex
last_name: Example
email: alex@example.com
phone: ""                 # with country code, e.g. +1 555 0100
linkedin: https://www.linkedin.com/in/alex-example
github: ""
website: https://alex.example.com
twitter: ""
location: Remote
country: ""              # where you live, as written in forms, e.g. Portugal
current_company: Freelance
current_title: Fintech writer & designer
years_experience: 8
rate: ""                  # left blank on purpose: forms asking pay come back as NEEDS YOU
availability: Immediately
heard_from: Job board
resume: /full/path/to/cv.pdf

# Optional: standard answers to common form questions. `ask` = question pattern (regex),
# `say` = answers in order of preference; the first one the form offers is ticked/typed.
# Questions not listed here are never guessed: they come back to you as NEEDS YOU.
answers:
  - ask: "count(r)?y (where|in which) you (currently )?(reside|live)"
    say: ["Portugal"]
  - ask: "how did you (hear|find|learn) about"
    say: ["LinkedIn", "Online job board", "Other"]
